name: Ubuntu validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and socket tools
        run: sudo apt-get update && sudo apt-get install -y build-essential iproute2
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile C library and run tests
        shell: bash
        run: make test 2>&1 | tee ubuntu-test-results.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Upload Ubuntu test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-results
          path: ubuntu-test-results.txt
